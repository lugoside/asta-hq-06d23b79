name: update-data

# Rigenera docs/data/players.json in AUTOMATICO dalle fonti PUBBLICHE (no login):
#  1) fetch_quotazioni.py  -> Quotazioni UFFICIALI di fantacalcio.it (id reali, QUOT, FVM)
#  2) fetch_sources.py     -> listone fantacalcio-online (nomi completi + overall) + fonti extra
#  2b) fetch_probabili.py  -> probabili formazioni + rigoristi/punizioni (fantacalcio.it, PRIMARI)
#  3) build_listone_fanta  -> unisce i due in pipeline/listone_base.json (fanta.it autorevole)
#  4) build_players.py     -> players.json (valore su FVM + enrichment)
# Tutto scrapabile senza credenziali. NB: i CEDUTI restano l'unico dato manuale (Excel login-gated
# -> pipeline/ceduti_ids.json). I "fuori lista" ancora quotati vengono esclusi da quella lista.
# - workflow_dispatch: avviabile A MANO, anche da telefono (GitHub app/web → Run workflow)
# - schedule: ogni notte, ma il job "gate" aggiorna SOLO la notte dopo la fine di una giornata
on:
  # push incluso solo per NON generare run-fantasma "failed / No jobs were run":
  # sul push il job viene saltato (if sotto) → run "skipped", nessuna mail di fallimento.
  push:
  workflow_dispatch:
  schedule:
    # Ogni notte alle ~02:00 ora italiana TUTTO L'ANNO (due cron per gestire l'ora legale):
    #  - estate (CEST, UTC+2), mesi 3-10 → 00:00 UTC = 02:00 IT
    #  - inverno (CET, UTC+1), mesi 11-2 → 01:00 UTC = 02:00 IT
    # (nei pochi giorni a cavallo del cambio d'ora può essere 01:00/03:00: irrilevante, decide il gate).
    # Il job "gate" fa girare l'aggiornamento SOLO la notte dopo l'ultima partita di una
    # giornata di Serie A (ieri partite, oggi no); le altre notti esce subito.
    # NB: il cron di GitHub è best-effort (può ritardare di ore). Giro immediato: avvio manuale
    # (Setup → ⚡ o "Run workflow"), che salta il gate ed esegue sempre.
    - cron: "0 0 * 3-10 *"       # FULL post-giornata, estate
    - cron: "0 1 * 1,2,11,12 *"  # FULL post-giornata, inverno
    # PROBABILI: ogni ora nella finestra diurna (07-20 UTC ≈ 08/09-21/22 IT). Il gate
    # should_run_probabili esegue davvero solo negli slot voluti (giorno prima ogni 3h;
    # giorno-gara ogni 2h fino a ~1-2h prima del calcio d'inizio della 1ª partita del turno).
    - cron: "0 7-20 * * *"

permissions:
  contents: write

jobs:
  # Sul push serve ALMENO un job che riesce, altrimenti GitHub crea una run vuota
  # "No jobs were run" marcata come FALLITA (→ mail di fallimento). Questo mini-job
  # gira solo sul push e fa un echo: la run del push risulta "success", niente mail.
  skip-on-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Push senza aggiornamento dati (il workflow gira solo su schedule o avvio manuale)."
  # GATE: decide se stanotte serve aggiornare (giorno dopo l'ultima partita di una giornata).
  # Sul workflow_dispatch (avvio manuale) forza sempre l'esecuzione.
  gate:
    # solo sui cron FULL delle 02:00 (o su avvio manuale), NON sul cron orario probabili
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '0 0 * 3-10 *' ||
      github.event.schedule == '0 1 * 1,2,11,12 *'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        name: Aggiorna solo il giorno dopo la fine di una giornata (o su avvio manuale)
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python pipeline/should_update.py
  update:
    # aggiornamento COMPLETO (post-giornata / manuale): solo se il gate lo consente
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa dipendenze
        run: pip install -r pipeline/requirements.txt
      - name: Quotazioni ufficiali fantacalcio.it (id reali, QUOT, FVM)
        run: python pipeline/fetch_quotazioni.py
      - name: Listone fantacalcio-online (nomi completi + overall) + fonti extra
        run: python pipeline/fetch_sources.py
      - name: Probabili formazioni + rigoristi/punizioni (fantacalcio.it)
        run: python pipeline/fetch_probabili.py || echo "probabili non aggiornate, uso l'ultima versione valida e proseguo"
      - name: Indisponibili/infortunati (fantacalcio.it, 2a fonte)
        run: python pipeline/fetch_indisponibili.py || echo "indisponibili non aggiornati, proseguo"
      - name: Formazioni goal.com (3a fonte per il consenso)
        run: python pipeline/fetch_goal_formazioni.py || echo "goal.com non aggiornato, uso l'ultima versione valida e proseguo"
      - name: Rifondi il listone base (unione fanta.it + nomi completi)
        run: python pipeline/build_listone_fanta.py
      - name: Ricostruisci players.json
        run: python pipeline/build_players.py
      - name: Dati di giornata (statistiche + probabili + fixtures)
        run: python pipeline/fetch_giornata.py || echo "giornata non aggiornata (fonte non disponibile), proseguo"
      - name: Statistiche ricche della mia rosa (scrape mirato ~25 pagine-giocatore)
        run: python pipeline/fetch_roster_stats.py || echo "detail rosa non aggiornato (fonte non disponibile), proseguo"
      - name: Classifica Serie A (forza squadre per il motore Formazione)
        run: python pipeline/fetch_classifica.py || echo "classifica non aggiornata (fonte non disponibile), proseguo"
      - name: Dati match-by-match della mia rosa + GF/GA casa/trasferta per squadra
        run: python pipeline/fetch_matches.py || echo "match rosa non aggiornati (fonte non disponibile), proseguo"
      - name: Posticipi/sospensioni (6 politico regola lega) + raffina giornata completa
        run: python pipeline/fetch_rinvii.py || echo "rinvii non calcolati (fonte non disponibile), proseguo"
      - name: Commit e pubblica (robusto ai race)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git add docs/data pipeline/formazioni_fanta.json pipeline/goal_formazioni.json pipeline/fvm_history.json pipeline/matches_cache.json
            if git diff --cached --quiet; then
              echo "Nessuna variazione nei dati."; exit 0
            fi
            git commit -m "chore: aggiorna dati listone [skip ci]"
            if git push; then
              echo "Pubblicato al tentativo $i."; exit 0
            fi
            echo "Push rifiutato (remoto avanzato): riallineo e rigenero (tentativo $i)…"
            git reset --hard HEAD~1
            git fetch origin main
            git reset --hard origin/main
            python pipeline/fetch_probabili.py || echo "probabili non aggiornate (retry), proseguo"
            python pipeline/fetch_goal_formazioni.py || echo "goal.com non aggiornato (retry), proseguo"
            python pipeline/build_listone_fanta.py
            python pipeline/build_players.py
          done
          echo "Impossibile pubblicare dopo 5 tentativi."; exit 1
      # Genera i dati RIDOTTI e li pubblica nel repo LITE (serve il secret LITE_REPO_TOKEN).
      # Se il secret non c'è, lo step si salta senza far fallire il workflow.
      - name: Pubblica players_lite.json nel repo LITE
        env:
          LITE_TOKEN: ${{ secrets.LITE_REPO_TOKEN }}
        run: |
          if [ -z "$LITE_TOKEN" ]; then echo "Secret LITE_REPO_TOKEN assente: salto la pubblicazione LITE."; exit 0; fi
          git clone --depth 1 "https://x-access-token:${LITE_TOKEN}@github.com/lugoside/fantaasta-lite.git" lite-repo
          LITE_OUT=lite-repo/docs/data node pipeline/build_lite.mjs
          cd lite-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/players_lite.json docs/data/players_lite.meta.json
          if git diff --cached --quiet; then
            echo "players_lite invariato: niente da pubblicare."
          else
            git commit -m "chore: aggiorna players_lite.json [skip ci]"
            git push
            echo "players_lite.json pubblicato nel repo LITE."
          fi

  # --- PROBABILI: aggiornamento LEGGERO e frequente (solo fetch_giornata in MERGE) ---
  # Gira sul cron orario; il gate esegue davvero solo negli slot di avvicinamento al turno.
  probabili-gate:
    if: github.event.schedule == '0 7-20 * * *'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        name: Esegui i probabili solo negli slot voluti (giorno prima 3h / giorno gara 2h)
        run: python pipeline/should_run_probabili.py
  probabili:
    needs: probabili-gate
    if: needs.probabili-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aggiorna SOLO i probabili di giornata (merge, preserva i dati del motore)
        run: python pipeline/fetch_giornata.py || echo "probabili non aggiornati (fonte non disponibile), proseguo"
      - name: Rinvii/6 politico (tiene fresca la regola posticipi anche in settimana)
        run: python pipeline/fetch_rinvii.py || echo "rinvii non calcolati, proseguo"
      - name: Commit probabili
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/giornata.json
          if git diff --cached --quiet; then
            echo "Probabili invariati: niente da pubblicare."; exit 0
          fi
          git commit -m "chore: aggiorna probabili di giornata [skip ci]"
          for i in 1 2 3; do
            if git push; then echo "Probabili pubblicati (tentativo $i)."; exit 0; fi
            echo "Push rifiutato: riallineo (tentativo $i)…"
            git pull --rebase --autostash origin main || true
          done
          echo "Push probabili non riuscito dopo 3 tentativi."; exit 1
