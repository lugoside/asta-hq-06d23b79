name: update-data

# Rigenera il listone (docs/data/players.json) dalla fonte ufficiale.
# - workflow_dispatch: avviabile A MANO, anche da telefono (GitHub app/web → Run workflow)
# - schedule: ogni mattina, utile nei giorni prima dell'asta
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC ogni giorno

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa dipendenze
        run: pip install -r pipeline/requirements.txt
      - name: Scarica il listone
        run: python pipeline/fetch_sources.py
      - name: Ricostruisci players.json
        run: python pipeline/build_players.py
      - name: Commit se ci sono variazioni
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Nessuna variazione nei dati."
          else
            git commit -m "chore: aggiorna dati listone [skip ci]"
            git push
          fi
